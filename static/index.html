<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker Compose Node App</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      text-align: center;
      padding: 2rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 3rem;
      letter-spacing: -0.04em;
    }

    p {
      margin: 1rem 0 1.5rem;
      line-height: 1.75;
      color: #e8f0ff;
    }

    .button {
      display: inline-block;
      padding: 0.95rem 1.8rem;
      border-radius: 999px;
      text-decoration: none;
      color: #1b2565;
      background: #ffffff;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
    }

    .api {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Welcome to the Docker Node App</h1>
    <p>
      This page is served by Express and includes integrated CSS for a polished single-page experience.
    </p>
    <a class="button" href="/api/data">View API Response</a>
    <div class="api">
      Try the API endpoint at <code>/api/data</code> for JSON output.
    </div>
  </div>
</body>
</html>
